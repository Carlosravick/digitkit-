<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
    <defs>
      <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#C62B7A" />
        <stop offset="100%" stop-color="#A01F63" />
      </linearGradient>
      <linearGradient id="softBg" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FDF0F7" />
        <stop offset="100%" stop-color="#FAF6F1" />
      </linearGradient>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F5B942" />
        <stop offset="100%" stop-color="#E8A030" />
      </linearGradient>
      <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4ECDC4" />
        <stop offset="100%" stop-color="#3D9970" />
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C62B7A" flood-opacity="0.15" />
      </filter>
    </defs>
    
      <rect width="400" height="220" fill="url(#softBg)" rx="20" />
      <rect x="30" y="30" width="160" height="140" fill="white" rx="16" filter="url(#shadow)" />
      <!-- Lightning bolt icon -->
      <polygon points="115,45 95,80 110,80 100,110 125,75 110,75" fill="#F5B942" />
      <text x="110" y="130" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#C62B7A">10 Minutos</text>
      <text x="110" y="150" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#3D9970">3x Mais Eficaz</text>

      <rect x="210" y="30" width="160" height="140" fill="white" rx="16" opacity="0.7" />
      <text x="290" y="90" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#888888">60m</text>
      <text x="290" y="130" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#888888">Academia</text>
    
  </svg>