      <path d="M 160 60 L 240 60 C 240 90, 220 100, 200 100 C 180 100, 160 90, 160 60 Z" fill="#3D9970" />
      <text x="200" y="135" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#2D2D2D">Alimentação Coreana Leve</text>
      <text x="200" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#C62B7A">Guia Simplificado Adaptado ao Brasil</text>
    
