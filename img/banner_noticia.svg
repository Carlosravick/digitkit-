      <rect x="40" y="40" width="110" height="26" fill="url(#goldGrad)" rx="13" />
      <text x="95" y="57" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">COMPROVADO</text>
      <text x="200" y="105" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2D2D2D">Método DigiKit Validado</text>
      <text x="200" y="132" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#666666">Ideal para rotinas sem tempo</text>
    
  </svg>