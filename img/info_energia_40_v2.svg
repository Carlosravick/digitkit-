<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
    <defs>
      <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#C62B7A" />
        <stop offset="100%" stop-color="#A01F63" />
      </linearGradient>
      <linearGradient id="softBg" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FDF0F7" />
        <stop offset="100%" stop-color="#FAF6F1" />
      </linearGradient>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#F5B942" />
        <stop offset="100%" stop-color="#E8A030" />
      </linearGradient>
      <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#4ECDC4" />
        <stop offset="100%" stop-color="#3D9970" />
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C62B7A" flood-opacity="0.15" />
      </filter>
    </defs>
    
      <rect width="400" height="220" fill="url(#softBg)" rx="20" />
      <rect x="20" y="20" width="360" height="180" fill="white" rx="16" filter="url(#shadow)" />
      <!-- Battery Icon -->
      <rect x="160" y="45" width="80" height="40" rx="6" fill="none" stroke="#C62B7A" stroke-width="3" />
      <rect x="240" y="57" width="6" height="16" rx="2" fill="#C62B7A" />
      <rect x="165" y="50" width="60" height="30" rx="3" fill="#C62B7A" />
      <text x="200" y="125" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#C62B7A">Mais Energia Após os 40</text>
      <text x="200" y="155" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#3D9970">83% relatam mais disposição em 2 semanas</text>
    
  </svg>