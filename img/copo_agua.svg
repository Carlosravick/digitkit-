      <!-- Water Drop Vector -->
      <path d="M 150 45 C 135 70, 130 80, 130 90 A 20 20 0 0 0 170 90 C 170 80, 165 70, 150 45 Z" fill="#3D9970" />
      <text x="150" y="150" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#3D9970">Hidratação e Metabolismo</text>
    
