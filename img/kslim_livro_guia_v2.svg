<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="woodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#E8DFD1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Clean minimalist background -->
  <rect width="600" height="600" fill="url(#woodBg)" />
  
  <!-- Wooden surface line -->
  <rect x="0" y="440" width="600" height="160" fill="#DBCBB5" opacity="0.6" />

  <!-- Tablet Mockup Frame -->
  <g transform="translate(160, 60)" filter="url(#shadow)">
    <!-- Outer bezel -->
    <rect width="280" height="420" rx="20" fill="#1C1C1E" stroke="#3A3A3C" stroke-width="3" />
    <!-- Screen -->
    <rect x="10" y="10" width="260" height="400" rx="12" fill="#FAF6F0" />

    <!-- Bonus Ribbon Badge -->
    <rect x="10" y="24" width="110" height="28" rx="6" fill="#C62B7A" />
    <text x="65" y="43" font-family="'Poppins', sans-serif" font-size="11" font-weight="800" text-anchor="middle" fill="#FFFFFF" letter-spacing="1">BÔNUS EXCLUSIVO</text>

    <!-- Lotus Icon -->
    <g transform="translate(130, 110)">
      <path d="M0 -25 C10 -15, 20 0, 0 20 C-20 0, -10 -15, 0 -25 Z" fill="none" stroke="#C49A6C" stroke-width="2" />
      <path d="M0 -25 C20 -5, 30 10, 0 20 C-30 10, -20 -5, 0 -25 Z" fill="none" stroke="#C49A6C" stroke-width="1.5" opacity="0.7" />
    </g>

    <!-- Title -->
    <text x="130" y="190" font-family="'Playfair Display', 'Georgia', serif" font-size="16" font-weight="700" text-anchor="middle" fill="#2C2C2C" letter-spacing="2">GUIA BÔNUS</text>
    <text x="130" y="225" font-family="'Playfair Display', 'Georgia', serif" font-size="28" font-weight="800" text-anchor="middle" fill="#C49A6C" letter-spacing="2">DIGIKIT</text>

    <!-- Divider line -->
    <line x1="70" y1="250" x2="190" y2="250" stroke="#C49A6C" stroke-width="1.5" opacity="0.5" />

    <!-- Subtitle -->
    <text x="130" y="280" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#666666">CARDÁPIO & ROTINA DE</text>
    <text x="130" y="298" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#666666">DESINCHAÇO GI</text>

    <!-- Author -->
    <text x="130" y="375" font-family="'Poppins', sans-serif" font-size="9" font-weight="500" text-anchor="middle" fill="#999999" letter-spacing="1">AUTORA: CAROLINA REIS</text>
  </g>
</svg>